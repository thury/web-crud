# Sitio de Nginx para web-crud. instalar.sh lo copia a
# /etc/nginx/sites-available/web-crud y cambia __HOST__ y __IP__ por los reales.
#
# Nginx termina el TLS, sirve los archivos estáticos y reenvía todo lo demás a
# Gunicorn por un socket Unix (no hay puerto TCP de Gunicorn expuesto).

# Freno a la fuerza bruta en el login: 10 peticiones por minuto por IP.
limit_req_zone $binary_remote_addr zone=web_crud_login:1m rate=10r/m;

upstream web_crud {
    server unix:/run/gunicorn/web-crud.sock fail_timeout=0;
}

# Cualquier petición HTTP con un nombre que no sea el de la tienda se corta.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__ __IP__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __HOST__ __IP__;

    ssl_certificate     /etc/ssl/web-crud/web-crud.crt;
    ssl_certificate_key /etc/ssl/web-crud/web-crud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:web_crud_ssl:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;        # no anunciar la versión de Nginx
    client_max_body_size 1m;  # la app solo recibe formularios pequeños

    # Archivos estáticos (los llena collectstatic). Los sirve Nginx directo.
    location /static/ {
        alias /srv/web-crud/staticfiles/;
        expires 7d;
    }

    # Nada de archivos ocultos (.git, .env, ...)
    location ~ /\. {
        deny all;
    }

    # Cabeceras que Django usa para saber que la petición llegó por HTTPS
    # y desde qué IP. Las heredan los dos location de abajo.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location = /login/ {
        limit_req zone=web_crud_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://web_crud;
    }

    location / {
        proxy_pass http://web_crud;
    }
}
