{% if is_paginated %}
<p>
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&q={{ q|urlencode }}{% if estado_actual %}&estado={{ estado_actual|urlencode }}{% endif %}">« Anterior</a>{% endif %}
  Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&q={{ q|urlencode }}{% if estado_actual %}&estado={{ estado_actual|urlencode }}{% endif %}">Siguiente »</a>{% endif %}
</p>
{% endif %}
