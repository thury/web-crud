services:
  web:
    build: .
    env_file: .env
    volumes:
      - db_data:/app/data
      - static_files:/app/staticfiles
    expose:
      - "8000"          # solo visible dentro de la red de Docker
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_data:
  static_files:
